; Lab PHP — surfaces relevant to 2026 runtime CVE research (mod_php / request lifecycle).
display_errors = On
error_reporting = E_ALL
log_errors = On

; CVE-2026-109618 — controlled OOM / multipart pressure (tune per experiment).
memory_limit = 128M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 16M
max_file_uploads = 20

; Sessions (persistent worker state across requests).
session.save_handler = files
session.use_strict_mode = 1
session.cookie_httponly = 1

; CVE-2026-109619 — session upload-progress consumer (enabled in typical deployments).
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
